name: AWS pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everyday-aws-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and lint
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Test backend
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        tier: [backend, frontend]

    env:
      REPOSITORY: everyday-${{ matrix.tier }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect OIDC claims
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " +
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              key: claims.get(key)
              for key in [
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "ref",
                  "environment"
              ]
          }, indent=2))
          PY

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::935173128637:role/everyday-github-actions-role
          aws-region: us-east-1
          retry-max-attempts: 2

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether this immutable image already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail

          count=$(aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'length(images)' \
            --output text)

          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.tier }}/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tier }}

      - name: Report image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: echo "$REGISTRY/$REPOSITORY:$IMAGE_TAG"