name: Publish container images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and lint
        run: npm run check
      - name: Build application
        run: npm run build
      - name: Test backend
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/everyday-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/everyday-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy to every healthy ASG instance through SSM
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          DEPLOY_AWS_REGION: us-east-1
        run: |
          set -euo pipefail
          script=$(cat <<'SCRIPT'
          set -eu
          cd "${DEPLOY_PATH:-/home/ubuntu/everyday}"
          if ! command -v aws >/dev/null 2>&1 || ! sudo docker compose version >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
            sudo apt-get -o Acquire::Retries=3 install -y curl unzip docker-compose-v2
          fi
          if ! command -v aws >/dev/null 2>&1; then
            awscli_arch="$(dpkg --print-architecture)"
            case "$awscli_arch" in
              amd64) awscli_arch=x86_64 ;;
              arm64) awscli_arch=aarch64 ;;
              *) echo "Unsupported architecture for AWS CLI: $awscli_arch" >&2; exit 1 ;;
            esac
            awscli_directory="$(mktemp -d)"
            curl --fail --location --silent --show-error --retry 3 \
              "https://awscli.amazonaws.com/awscli-exe-linux-${awscli_arch}.zip" \
              --output "${awscli_directory}/awscliv2.zip"
            unzip -q "${awscli_directory}/awscliv2.zip" -d "$awscli_directory"
            sudo "${awscli_directory}/aws/install"
            rm -rf -- "$awscli_directory"
          fi
          test -f compose.aws.yaml || { echo "Missing $PWD/compose.aws.yaml" >&2; exit 1; }
          test -f .env.aws || { echo "Missing $PWD/.env.aws" >&2; exit 1; }
          ghcr_username_lower="$(printf '%s' "$GHCR_USERNAME" | tr '[:upper:]' '[:lower:]')"
          ghcr_token="$(aws ssm get-parameter --region "$DEPLOY_AWS_REGION" --name /everyday/ghcr-read-token --with-decryption --query 'Parameter.Value' --output text)"
          printf '%s' "$ghcr_token" | sudo docker login ghcr.io --username "$ghcr_username_lower" --password-stdin
          sudo sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=ghcr.io/${ghcr_username_lower}/everyday-backend:${IMAGE_TAG}#" .env.aws
          sudo sed -i "s#^FRONTEND_IMAGE=.*#FRONTEND_IMAGE=ghcr.io/${ghcr_username_lower}/everyday-frontend:${IMAGE_TAG}#" .env.aws
          sudo docker compose --env-file .env.aws -f compose.aws.yaml pull
          sudo docker compose --env-file .env.aws -f compose.aws.yaml up -d --remove-orphans
          sudo docker image prune -af --filter "until=168h"
          sudo docker compose --env-file .env.aws -f compose.aws.yaml ps
          SCRIPT
          )
          script="$(printf 'export IMAGE_TAG=%q GHCR_USERNAME=%q DEPLOY_PATH=%q DEPLOY_AWS_REGION=%q\n%s' \
            "$IMAGE_TAG" "$GHCR_USERNAME" "${DEPLOY_PATH:-/home/ubuntu/everyday}" "$DEPLOY_AWS_REGION" "$script")"
          parameters=$(jq -n --arg script "$script" '{commands: [$script]}')
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=aws-cea-app" \
            --parameters "$parameters" \
            --comment "Deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 30); do
            sleep 10
            invocations=$(aws ssm list-command-invocations --command-id "$command_id" --details --output json)
            if echo "$invocations" | jq -e '(.CommandInvocations | length) > 0 and all(.CommandInvocations[]; .Status == "Success")' >/dev/null; then
              exit 0
            fi
            if echo "$invocations" | jq -e 'any(.CommandInvocations[]?; .Status | IN("Failed", "Cancelled", "TimedOut", "Undeliverable"))' >/dev/null; then
              echo "$invocations" | jq -r '.CommandInvocations[] | "\(.InstanceId): \(.Status)\n\(.CommandPlugins[]?.Output // "")"'
              exit 1
            fi
          done
          echo "Timed out waiting for SSM deployment command $command_id"
          exit 1
